name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
        # clyngor can solve either by running the clingo binary or through
        # the official clingo python module, and the two code paths differ
        # enough (parsed stdout vs API objects, statistics shape, embedded
        # #script support) that both need to be exercised. 'module' is the
        # deployment that pip-installed clingo -- which ships no
        # executable -- and has no binary anywhere: solving there relies
        # entirely on the fallback of Solver(backend='auto').
        backend: [binary, module, binary+module]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the clingo binary
        # ubuntu ships clingo inside the gringo package
        if: matrix.backend != 'module'
        run: sudo apt-get update && sudo apt-get install -y gringo

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backend }}" = "binary" ]; then
            # deliberately without the clingo module, to keep the pure
            # subprocess code path honest
            pip install 'Arpeggio>=1.6.1' pytest
          else
            pip install -e '.[test]'
          fi

      - name: Report the environment under test
        run: |
          command -v clingo && clingo --version | head -3 || echo 'clingo binary: absent'
          python -c "import importlib.util as u; print('clingo module:', u.find_spec('clingo') is not None)"

      - name: Run tests
        # --doctest-modules because part of the documented behavior lives
        # in docstrings; -rs to make skips visible, since which tests are
        # skipped is exactly what differs between backends.
        run: python -m pytest clyngor --doctest-modules -rs -v
